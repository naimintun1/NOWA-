workflows:
  nowa-android:
    name: NOWA Android
    environment:
      java: 21
      android_signing:
        - nowa_release
      vars:
        PACKAGE_NAME: "com.nowa.app"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
