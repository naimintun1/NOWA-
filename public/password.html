<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change Password</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif;
}
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#141a2b;
  border-bottom:1px solid #29334a;
}
.back{
  font-size:28px;
  margin-right:15px;
  cursor:pointer;
}
.title{
  font-size:20px;
  font-weight:bold;
}
.content{
  padding:20px 18px;
}
label{
  display:block;
  margin:0 0 7px;
  color:#9aa7bd;
  font-size:13px;
}
.field{
  position:relative;
  margin-bottom:16px;
}
input{
  width:100%;
  padding:13px 45px 13px 13px;
  border:1px solid #29334a;
  border-radius:11px;
  outline:none;
  background:#151c2d;
  color:#fff;
  font-size:15px;
}
.eye{
  position:absolute;
  right:13px;
  top:12px;
  cursor:pointer;
  color:#8d98ad;
  user-select:none;
}
button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#168cff;
  color:#fff;
  font-size:15px;
  font-weight:600;
}
#status{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:#8d98ad;
}
</style>

<style id="nowa-global-theme">
body.light-theme{
  background:#f4f6fa !important;
  color:#111827 !important;
}

body.light-theme .topbar,
body.light-theme .nav,
body.light-theme .section,
body.light-theme .profile-card,
body.light-theme .info,
body.light-theme .friends-section,
body.light-theme .item,
body.light-theme .theme-option,
body.light-theme .chat-item,
body.light-theme .online-user,
body.light-theme .search-results{
  background:#ffffff !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .search,
body.light-theme input,
body.light-theme textarea,
body.light-theme #messageInput{
  background:#eef1f6 !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .section-title,
body.light-theme .item-title,
body.light-theme .theme-title,
body.light-theme .username,
body.light-theme .chat-name,
body.light-theme .online-name,
body.light-theme .friend-name,
body.light-theme .name,
body.light-theme .title,
body.light-theme strong{
  color:#111827 !important;
}

body.light-theme .item-sub,
body.light-theme .empty,
body.light-theme .last-message,
body.light-theme .chat-time,
body.light-theme .friend-name,
body.light-theme .theme-sub,
body.light-theme .info-title{
  color:#6b7280 !important;
}

body.light-theme .back{
  color:#111827 !important;
}

body.light-theme .theme-option.active{
  border-color:#168cff !important;
}
</style>

</head>

<body>

<script id="nowa-global-theme-script">
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";
  document.body.classList.toggle("light-theme", theme === "light");
})();
</script>


<header class="topbar">
  <div class="back" onclick="history.back()">‹</div>
  <div class="title">Change Password</div>
</header>

<main class="content">

  <label>Current password</label>
  <div class="field">
    <input id="currentPassword" type="password">
    <span class="eye" onclick="togglePassword('currentPassword',this)">👁</span>
  </div>

  <label>New password</label>
  <div class="field">
    <input id="newPassword" type="password">
    <span class="eye" onclick="togglePassword('newPassword',this)">👁</span>
  </div>

  <label>Confirm new password</label>
  <div class="field">
    <input id="confirmPassword" type="password">
    <span class="eye" onclick="togglePassword('confirmPassword',this)">👁</span>
  </div>

  <button onclick="changePassword()">Change Password</button>

  <div id="status"></div>

</main>

<script>
let currentUserId = null;

function togglePassword(id, eye){
  const input = document.getElementById(id);

  if(input.type === "password"){
    input.type = "text";
    eye.textContent = "🙈";
  }else{
    input.type = "password";
    eye.textContent = "👁";
  }
}

async function getCurrentUser(){

  const username =
    localStorage.getItem("nowaUsername") || "";

  if(!username){
    window.location.href = "/";
    return;
  }

  const response = await fetch(
    "/api/users?q=" + encodeURIComponent(username)
  );

  if(!response.ok) return;

  const users = await response.json();

  const user =
    users.find(u => u.username === username);

  if(user){
    currentUserId = user.id;
  }
}

async function changePassword(){

  const currentPassword =
    document.getElementById("currentPassword").value;

  const newPassword =
    document.getElementById("newPassword").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const status =
    document.getElementById("status");

  if(!currentPassword || !newPassword || !confirmPassword){
    status.textContent = "Please fill in all fields.";
    return;
  }

  if(newPassword !== confirmPassword){
    status.textContent = "New passwords do not match.";
    return;
  }

  if(newPassword.length < 6){
    status.textContent =
      "New password must be at least 6 characters.";
    return;
  }

  if(!currentUserId){
    status.textContent = "User not found.";
    return;
  }

  try{

    const response = await fetch("/api/change-password", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        userId: currentUserId,
        currentPassword: currentPassword,
        newPassword: newPassword
      })
    });

    const data = await response.json();

    if(!response.ok){
      status.textContent =
        data.message || "Password change failed.";
      return;
    }

    status.textContent = "Password changed successfully.";

    setTimeout(() => {
      window.location.href = "/settings.html";
    }, 800);

  }catch(error){
    status.textContent =
      "Cannot connect to NOWA server.";
  }
}

getCurrentUser();
</script>


<script id="nowa-theme-live">
(function(){
  const applyTheme = () => {
    const theme = localStorage.getItem("nowaTheme") || "dark";
    document.body.classList.toggle("light-theme", theme === "light");
  };

  applyTheme();

  window.addEventListener("storage", applyTheme);
})();
</script>

</body>
</html>
