<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOWA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 380px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 28px;
      background: #168cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      box-shadow: 0 12px 35px rgba(22,140,255,.3);
    }

    h1 { margin: 0; font-size: 32px; }

    .tagline {
      color: #8f9bb3;
      margin: 8px 0 30px;
    }

    .card {
      background: #141a2b;
      padding: 25px;
      border-radius: 22px;
      text-align: left;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd3e5;
      font-size: 14px;
    }

    input {
      -webkit-appearance: none;
      appearance: none;
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
      width: 100%;
      padding: 14px;
      border: 1px solid #29334a;
      border-radius: 12px;
      background: #0d1322;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #168cff;
      box-shadow: 0 0 0 2px rgba(22,140,255,.15);
    }

    .password-box { position: relative; }

    .password-box input {
      -webkit-appearance: none;
      appearance: none;
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto; padding-right: 48px; }

    .eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #8f9bb3;
    }

    button {
      cursor: pointer;
    }

    .login {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #168cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .signup {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 1px solid #29334a;
      border-radius: 12px;
      background: transparent;
      color: white;
      font-size: 15px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .hidden { display: none; }

    .back {
      margin-bottom: 18px;
      color: #8f9bb3;
      cursor: pointer;
      font-size: 14px;
    }
  </style>

<style id="nowa-global-theme">
body.light-theme{
  background:#f4f6fa !important;
  color:#111827 !important;
}

body.light-theme .topbar,
body.light-theme .nav,
body.light-theme .section,
body.light-theme .profile-card,
body.light-theme .info,
body.light-theme .friends-section,
body.light-theme .item,
body.light-theme .theme-option,
body.light-theme .chat-item,
body.light-theme .online-user,
body.light-theme .search-results{
  background:#ffffff !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .search,
body.light-theme input,
body.light-theme textarea,
body.light-theme #messageInput{
  background:#eef1f6 !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .section-title,
body.light-theme .item-title,
body.light-theme .theme-title,
body.light-theme .username,
body.light-theme .chat-name,
body.light-theme .online-name,
body.light-theme .friend-name,
body.light-theme .name,
body.light-theme .title,
body.light-theme strong{
  color:#111827 !important;
}

body.light-theme .item-sub,
body.light-theme .empty,
body.light-theme .last-message,
body.light-theme .chat-time,
body.light-theme .friend-name,
body.light-theme .theme-sub,
body.light-theme .info-title{
  color:#6b7280 !important;
}

body.light-theme .back{
  color:#111827 !important;
}

body.light-theme .theme-option.active{
  border-color:#168cff !important;
}
</style>

</head>

<body>

<script id="nowa-global-theme-script">
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";
  document.body.classList.toggle("light-theme", theme === "light");
})();
</script>


  <div class="container">

    <div class="logo">N</div>

    <h1>NOWA</h1>
    <p class="tagline">Always connected.</p>

    <!-- LOGIN -->
    <div class="card" id="loginCard">

      <div class="field">
        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="Enter username">
      </div>

      <div class="field">
        <label>Password</label>

        <div class="password-box">
          <input id="loginPassword" type="password" placeholder="Enter password">
          <span class="eye" onclick="togglePassword('loginPassword')">👁</span>
        </div>
      </div>

      <button class="login" onclick="login()">Login</button>
      <button class="signup" onclick="showSignup()">Create Account</button>

      <div class="message" id="loginMessage"></div>

    </div>

    <!-- SIGN UP -->
    <div class="card hidden" id="signupCard">

      <div class="back" onclick="showLogin()">← Back to Login</div>

      <div class="field">
        <label>Username</label>
        <input id="signupUsername" type="text" placeholder="Choose a username">
      </div>

      <div class="field">
        <label>Password</label>

        <div class="password-box">
          <input id="signupPassword" type="password" placeholder="At least 6 characters">
          <span class="eye" onclick="togglePassword('signupPassword')">👁</span>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>

        <div class="password-box">
          <input id="confirmPassword" type="password" placeholder="Enter password again">
          <span class="eye" onclick="togglePassword('confirmPassword')">👁</span>
        </div>
      </div>

      <button class="login" onclick="signup()">Create Account</button>

      <div class="message" id="message"></div>

    </div>

  </div>

  <script>
if (localStorage.getItem("nowaUsername")) {
  window.location.href = "/home.html";
}
</script>
<script>
    function togglePassword(id) {
      const input = document.getElementById(id);

      input.type =
        input.type === "password"
          ? "text"
          : "password";
    }

    async function login() {
      const username =
        document.getElementById("loginUsername").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");

      if (!username || !password) {
        message.textContent = "Please enter username and password.";
        return;
      }

      message.textContent = "Signing in...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        message.textContent = data.message;

        if (data.success) {
          localStorage.setItem("nowaUsername", data.user.username);

          setTimeout(() => {
            window.location.href = "/home.html";
          }, 700);
        }

      } catch (error) {
        message.textContent = "Cannot connect to NOWA server.";
      }
    }

    function showSignup() {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("signupCard").classList.remove("hidden");
    }

    function showLogin() {
      document.getElementById("signupCard").classList.add("hidden");
      document.getElementById("loginCard").classList.remove("hidden");
    }

    async function signup() {
      const username =
        document.getElementById("signupUsername").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");

      if (!username || !password || !confirmPassword) {
        message.textContent = "Please fill in all fields.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Creating account...";

      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        message.textContent = data.message;

        if (data.success) {
          message.textContent = "Account created successfully!";

          localStorage.setItem("nowaUsername", username);

          setTimeout(() => {
            window.location.href = "/home.html";
          }, 1000);
        }

      } catch (error) {
        message.textContent = "Cannot connect to NOWA server.";
      }
    }
  </script>


<script id="nowa-theme-live">
(function(){
  const applyTheme = () => {
    const theme = localStorage.getItem("nowaTheme") || "dark";
    document.body.classList.toggle("light-theme", theme === "light");
  };

  applyTheme();

  window.addEventListener("storage", applyTheme);
})();
</script>

</body>
</html>
