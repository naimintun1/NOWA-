<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Privacy</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif;
}
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#141a2b;
  border-bottom:1px solid #29334a;
}
.back{
  font-size:28px;
  margin-right:15px;
  cursor:pointer;
}
.title{
  font-size:20px;
  font-weight:bold;
}
.content{
  padding:18px;
}
.item{
  background:#151c2d;
  border-radius:14px;
  padding:15px;
  margin-bottom:10px;
}
.item-title{
  font-size:15px;
  font-weight:600;
}
.item-sub{
  margin-top:5px;
  color:#7f8da8;
  font-size:12px;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.switch{
  position:relative;
  width:48px;
  height:26px;
  flex-shrink:0;
}
.switch{
  position:relative;
  width:48px;
  height:26px;
  flex-shrink:0;
  display:block;
  cursor:pointer;
}

.switch input{
  position:absolute;
  opacity:0;
  width:100%;
  height:100%;
  margin:0;
  cursor:pointer;
  z-index:2;
}
.slider{
  position:absolute;
  inset:0;
  background:#29334a;
  border-radius:20px;
  cursor:pointer;
  transition:.2s;
}
.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}
.switch input:checked + .slider{
  background:#168cff;
}
.switch input:checked + .slider:before{
  transform:translateX(22px);
}
</style>

<style id="nowa-global-theme">
body.light-theme{
  background:#f4f6fa !important;
  color:#111827 !important;
}

body.light-theme .topbar,
body.light-theme .nav,
body.light-theme .section,
body.light-theme .profile-card,
body.light-theme .info,
body.light-theme .friends-section,
body.light-theme .item,
body.light-theme .theme-option,
body.light-theme .chat-item,
body.light-theme .online-user,
body.light-theme .search-results{
  background:#ffffff !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .search,
body.light-theme input,
body.light-theme textarea,
body.light-theme #messageInput{
  background:#eef1f6 !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .section-title,
body.light-theme .item-title,
body.light-theme .theme-title,
body.light-theme .username,
body.light-theme .chat-name,
body.light-theme .online-name,
body.light-theme .friend-name,
body.light-theme .name,
body.light-theme .title,
body.light-theme strong{
  color:#111827 !important;
}

body.light-theme .item-sub,
body.light-theme .empty,
body.light-theme .last-message,
body.light-theme .chat-time,
body.light-theme .friend-name,
body.light-theme .theme-sub,
body.light-theme .info-title{
  color:#6b7280 !important;
}

body.light-theme .back{
  color:#111827 !important;
}

body.light-theme .theme-option.active{
  border-color:#168cff !important;
}
</style>

</head>

<body>

<script id="nowa-global-theme-script">
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";
  document.body.classList.toggle("light-theme", theme === "light");
})();
</script>


<header class="topbar">
  <div class="back" onclick="history.back()">‹</div>
  <div class="title">Privacy</div>
</header>

<main class="content">

  <div class="item">
    <div class="row">
      <div>
        <div class="item-title">Online Status</div>
        <div class="item-sub">Allow others to see when you are online</div>
      </div>

      <label class="switch">
        <input id="onlineStatus" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="item">
    <div class="row">
      <div>
        <div class="item-title">Profile Visibility</div>
        <div class="item-sub">Allow other users to view your profile</div>
      </div>

      <label class="switch">
        <input id="profileVisibility" type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

</main>

<script>
const username = localStorage.getItem("nowaUsername") || "";

async function getCurrentUser() {
  const response = await fetch(
    "/api/users?q=" + encodeURIComponent(username)
  );

  const users = await response.json();
  return users.find(user => user.username === username);
}

async function loadPrivacy() {
  const user = await getCurrentUser();

  if (!user) return;

  const response = await fetch(
    "/api/privacy?userId=" + user.id
  );

  if (!response.ok) return;

  const data = await response.json();

  document.getElementById("onlineStatus").checked =
    data.onlineStatus;

  document.getElementById("profileVisibility").checked =
    data.profileVisibility;
}

async function savePrivacy() {
  const user = await getCurrentUser();

  if (!user) return;

  await fetch("/api/privacy", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      userId: user.id,
      onlineStatus:
        document.getElementById("onlineStatus").checked,
      profileVisibility:
        document.getElementById("profileVisibility").checked
    })
  });
}

document.getElementById("onlineStatus")
  .addEventListener("change", savePrivacy);

document.getElementById("profileVisibility")
  .addEventListener("change", savePrivacy);

loadPrivacy();
</script>


<script id="nowa-theme-live">
(function(){
  const applyTheme = () => {
    const theme = localStorage.getItem("nowaTheme") || "dark";
    document.body.classList.toggle("light-theme", theme === "light");
  };

  applyTheme();

  window.addEventListener("storage", applyTheme);
})();
</script>

</body>
</html>
