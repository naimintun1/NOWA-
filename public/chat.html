<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOWA Chat</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1220;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:64px;
  padding:0 16px;
  display:flex;
  align-items:center;
  gap:12px;
  background:#141a2b;
  border-bottom:1px solid #29334a;
}
.back{
  font-size:28px;
  cursor:pointer;
}
.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#168cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.username{
  font-size:18px;
  font-weight:bold;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.message{
  max-width:75%;
  padding:10px 13px;
  border-radius:16px;
  line-height:1.4;
  word-wrap:break-word;
}
.me{
  align-self:flex-end;
  background:#168cff;
  border-bottom-right-radius:5px;
}
.them{
  align-self:flex-start;
  background:#20283a;
  border-bottom-left-radius:5px;
}

.message-time{
  display:block;
  margin-top:4px;
  font-size:10px;
  opacity:.65;
  text-align:right;
}
.input-area{
  padding:10px;
  display:flex;
  gap:8px;
  background:#141a2b;
  border-top:1px solid #29334a;
}
input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  -webkit-user-select:text;
  user-select:text;
  padding:13px;
  border-radius:22px;
  background:#20283a;
  color:#fff;
  font-size:16px;
}
button{
  border:0;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#168cff;
  color:#fff;
  font-size:20px;
}

.follow-btn{
  width:auto;
  height:auto;
  padding:5px 12px;
  margin-top:4px;
  border-radius:14px;
  background:#168cff;
  font-size:13px;
}
</style>

<style id="nowa-global-theme">
body.light-theme{
  background:#f4f6fa !important;
  color:#111827 !important;
}

body.light-theme .topbar,
body.light-theme .nav,
body.light-theme .section,
body.light-theme .profile-card,
body.light-theme .info,
body.light-theme .friends-section,
body.light-theme .item,
body.light-theme .theme-option,
body.light-theme .chat-item,
body.light-theme .online-user,
body.light-theme .search-results{
  background:#ffffff !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .search,
body.light-theme input,
body.light-theme textarea,
body.light-theme #messageInput{
  background:#eef1f6 !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .section-title,
body.light-theme .item-title,
body.light-theme .theme-title,
body.light-theme .username,
body.light-theme .chat-name,
body.light-theme .online-name,
body.light-theme .friend-name,
body.light-theme .name,
body.light-theme .title,
body.light-theme strong{
  color:#111827 !important;
}

body.light-theme .item-sub,
body.light-theme .empty,
body.light-theme .last-message,
body.light-theme .chat-time,
body.light-theme .friend-name,
body.light-theme .theme-sub,
body.light-theme .info-title{
  color:#6b7280 !important;
}

body.light-theme .back{
  color:#111827 !important;
}

body.light-theme .theme-option.active{
  border-color:#168cff !important;
}
</style>

</head>

<body>

<script id="nowa-global-theme-script">
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";
  document.body.classList.toggle("light-theme", theme === "light");
})();
</script>


<header class="topbar">
  <div class="back" onclick="history.back()">‹</div>
  <div class="avatar" id="avatar">N</div>
  <div>
    <div class="username" id="username">User</div>
    <div id="onlineStatus" style="font-size:11px;opacity:.65;margin-top:2px;">Offline</div>
    <button id="followBtn" class="follow-btn">Follow</button>
  </div>
</header>

<main class="messages" id="messages"></main>

<form class="input-area" id="messageForm">
  <input
    id="messageInput"
    type="text"
    placeholder="Message..."
    autocomplete="off"
    autocapitalize="sentences"
    enterkeyhint="send"
    inputmode="text"
  >
  <button type="submit">➤</button>
</form>

<script src="/socket.io/socket.io.js"></script>



<script>
const params = new URLSearchParams(window.location.search);

const receiverId = Number(params.get("userId"));
const receiverUsername = params.get("username");
const currentUsername = localStorage.getItem("nowaUsername");

const usernameEl = document.getElementById("username");
const avatarEl = document.getElementById("avatar");
const messagesEl = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const followBtn = document.getElementById("followBtn");

if (receiverUsername) {
  usernameEl.textContent = receiverUsername;
  avatarEl.textContent = receiverUsername.charAt(0).toUpperCase();
}

async function getCurrentUser() {
  if (!currentUsername) return null;

  const response = await fetch(
    "/api/users?q=" + encodeURIComponent(currentUsername)
  );

  const users = await response.json();

  return users.find(user => user.username === currentUsername) || null;
}

async function markMessagesRead(currentUserId) {
  await fetch("/api/messages/read", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      senderId: receiverId,
      receiverId: currentUserId
    })
  });
}

async function loadMessages(currentUserId) {
  await markMessagesRead(currentUserId);

  const response = await fetch(
    "/api/messages?senderId=" + currentUserId +
    "&receiverId=" + receiverId
  );

  const messages = await response.json();

  messagesEl.innerHTML = "";

  messages.forEach(msg => {
    addMessage(msg, currentUserId);
  });

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(msg, currentUserId) {
  if (document.querySelector('[data-message-id="' + msg.id + '"]')) {
    return;
  }

  const div = document.createElement("div");

  div.className =
    "message " +
    (Number(msg.sender_id) === Number(currentUserId) ? "me" : "them");

  div.dataset.messageId = msg.id;

  const text = document.createElement("div");
  text.textContent = msg.message;

  const time = document.createElement("small");
  time.className = "message-time";
  time.textContent = new Date(
    String(msg.created_at).replace(" ", "T") + "Z"
  ).toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  div.appendChild(text);
  div.appendChild(time);
  messagesEl.appendChild(div);
}

async function updateFollowButton() {
  const currentUser = await getCurrentUser();

  if (!currentUser || !receiverId) return;

  const response = await fetch(
    "/api/follow-status?followerId=" + currentUser.id +
    "&followingId=" + receiverId
  );

  const data = await response.json();

  if (data.friend) {
    followBtn.textContent = "Friend";
    followBtn.style.background = "#29334a";
    followBtn.style.color = "#9aa7bd";
  } else if (data.following) {
    followBtn.textContent = "Following";
    followBtn.style.background = "#29334a";
    followBtn.style.color = "#9aa7bd";
  } else if (data.followsYou) {
    followBtn.textContent = "Follow you";
    followBtn.style.background = "#168cff";
    followBtn.style.color = "#fff";
  } else {
    followBtn.textContent = "Follow";
    followBtn.style.background = "#168cff";
    followBtn.style.color = "#fff";
  }
}

followBtn.addEventListener("click", async () => {
  const currentUser = await getCurrentUser();

  if (!currentUser || !receiverId) return;

  const following =
    followBtn.textContent === "Following" ||
    followBtn.textContent === "Friend";

  await fetch(
    following ? "/api/unfollow" : "/api/follow",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        followerId: currentUser.id,
        followingId: receiverId
      })
    }
  );

  updateFollowButton();
});

messageForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = messageInput.value.trim();

  if (!message) return;

  const currentUser = await getCurrentUser();

  if (!currentUser) return;

  const response = await fetch("/api/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      senderId: currentUser.id,
      receiverId: receiverId,
      message: message
    })
  });

  const saved = await response.json();

  if (response.ok) {
    addMessage(saved, currentUser.id);
    messageInput.value = "";
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
});

async function updateOnlineStatus() {
  if (!receiverId) return;

  const response = await fetch(
    "/api/online-status?userId=" + receiverId
  );

  const data = await response.json();

  document.getElementById("onlineStatus").textContent =
    data.online ? "Online" : "Offline";
}

async function startChat() {
  const currentUser = await getCurrentUser();

  if (!currentUser || !receiverId) return;

  await loadMessages(currentUser.id);
  await updateFollowButton();
  await updateOnlineStatus();
}

startChat();
</script>


<script id="nowa-theme-live">
(function(){
  const applyTheme = () => {
    const theme = localStorage.getItem("nowaTheme") || "dark";
    document.body.classList.toggle("light-theme", theme === "light");
  };

  applyTheme();

  window.addEventListener("storage", applyTheme);
})();
</script>

</body>
</html>
