<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOWA - Chats</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#0b1020;
      color:white;
    }

    .topbar{
      height:64px;
      padding:0 18px;
      display:flex;
      align-items:center;
      background:#141a2b;
      border-bottom:1px solid #29334a;
      position:sticky;
      top:0;
    }

    .title{
      font-size:21px;
      font-weight:bold;
    }

    .content{
      width:92%;
      max-width:600px;
      margin:22px auto 90px;
    }

    .search{
      width:100%;
      padding:14px 16px;
      border:1px solid #29334a;
      border-radius:14px;
      background:#141a2b;
      color:white;
      outline:none;
      font-size:15px;
      margin-bottom:18px;
    }

    .search:focus{
      border-color:#168cff;
    }

    .chat-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .empty{
      text-align:center;
      padding:30px 10px;
      color:#8f9bb3;
      line-height:1.6;
    }

    .chat-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border-radius:14px;
      background:#191f2e;
      cursor:pointer;
    }

    .chat-item:hover{
      background:#222b3e;
    }

    .chat-avatar{
      width:46px;
      height:46px;
      border-radius:50%;
      background:#29334a;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:18px;
      flex-shrink:0;
    }

    .chat-name{
      font-size:15px;
      font-weight:600;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:68px;
      background:#141a2b;
      border-top:1px solid #29334a;
      display:flex;
      justify-content:space-around;
      align-items:center;
    }

    .nav-item{
      position:relative;
      min-width:62px;
      padding:7px 8px;
      border-radius:12px;
      color:#8f9bb3;
      text-align:center;
      font-size:12px;
    }

    .nav-item.active{
      color:#fff;
      background:rgba(22,140,255,.18);
      text-shadow:0 0 10px rgba(22,140,255,.8);
    }

    .nav-item.active::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-3px;
      transform:translateX(-50%);
      width:22px;
      height:3px;
      border-radius:3px;
      background:#168cff;
    }

    .nav-icon{
      font-size:21px;
      margin-bottom:3px;
    }
  
.chat-info{
  flex:1;
  min-width:0;
}

.chat-text-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:4px;
}

.last-message{
  flex:1;
  min-width:0;
  color:#8f9bb3;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time{
  color:#68758d;
  font-size:11px;
  flex-shrink:0;
}


.chat-avatar{
  position:relative;
}

.chat-online-dot{
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#22c55e;
  border:2px solid #191f2e;
}


.unread-badge{
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:10px;
  background:#168cff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:bold;
  flex-shrink:0;
}

</style>

<style id="nowa-global-theme">
body.light-theme{
  background:#f4f6fa !important;
  color:#111827 !important;
}

body.light-theme .topbar,
body.light-theme .nav,
body.light-theme .section,
body.light-theme .profile-card,
body.light-theme .info,
body.light-theme .friends-section,
body.light-theme .item,
body.light-theme .theme-option,
body.light-theme .chat-item,
body.light-theme .online-user,
body.light-theme .search-results{
  background:#ffffff !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .search,
body.light-theme input,
body.light-theme textarea,
body.light-theme #messageInput{
  background:#eef1f6 !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .section-title,
body.light-theme .item-title,
body.light-theme .theme-title,
body.light-theme .username,
body.light-theme .chat-name,
body.light-theme .online-name,
body.light-theme .friend-name,
body.light-theme .name,
body.light-theme .title,
body.light-theme strong{
  color:#111827 !important;
}

body.light-theme .item-sub,
body.light-theme .empty,
body.light-theme .last-message,
body.light-theme .chat-time,
body.light-theme .friend-name,
body.light-theme .theme-sub,
body.light-theme .info-title{
  color:#6b7280 !important;
}

body.light-theme .back{
  color:#111827 !important;
}

body.light-theme .theme-option.active{
  border-color:#168cff !important;
}
</style>

</head>

<body>

<script id="nowa-global-theme-script">
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";
  document.body.classList.toggle("light-theme", theme === "light");
})();
</script>


<header class="topbar">
  <div class="title">Chats</div>
</header>

<main class="content">

  <input
    class="search"
    id="chatSearch"
    type="text"
    placeholder="Search chats..."
    autocomplete="off"
  >

  <div class="chat-list" id="chatList">
    <div class="empty">No conversations yet.</div>
  </div>

</main>

<nav class="bottom-nav">

  <div class="nav-item" onclick="window.location.href='/home.html'">
    <div class="nav-icon">⌂</div>
    Home
  </div>

  <div class="nav-item active">
    <div class="nav-icon">💬</div>
    Chats
  </div>

  <div class="nav-item" onclick="window.location.href='/profile.html'">
    <div class="nav-icon">👤</div>
    Profile
  </div>

  <div class="nav-item" onclick="window.location.href='/settings.html'">
    <div class="nav-icon">⚙</div>
    Settings
  </div>

</nav>

<script>
async function loadChats(){
  const username = localStorage.getItem("nowaUsername");
  if(!username) return;

  const users = await fetch(
    "/api/users?q=" + encodeURIComponent(username)
  ).then(r => r.json());

  const currentUser = users.find(u => u.username === username);
  if(!currentUser) return;

  const response = await fetch(
    "/api/conversations?userId=" + currentUser.id
  );

  const conversations = await response.json();

  const unreadResponse = await fetch(
    "/api/unread-counts?userId=" + currentUser.id
  );

  const unreadCounts = await unreadResponse.json();

  const unreadMap = {};
  unreadCounts.forEach(item => {
    unreadMap[item.user_id] = item.unread_count;
  });

  await Promise.all(
    conversations.map(async user => {
      try{
        const status = await fetch(
          "/api/online-status?userId=" + user.user_id
        ).then(r => r.json());

        user.online = status.online;
      }catch(error){
        user.online = false;
      }
    })
  );

  const list = document.getElementById("chatList");
  list.innerHTML = "";

  if(!conversations.length){
    list.innerHTML =
      '<div class="empty">No conversations yet.</div>';
    return;
  }

  conversations.forEach(user => {
    const item = document.createElement("div");
    item.className = "chat-item";

    const avatar = document.createElement("div");
    avatar.className = "chat-avatar";

    if(user.profile_photo){
      avatar.style.backgroundImage =
        "url(" + user.profile_photo + ")";
      avatar.style.backgroundSize = "cover";
      avatar.style.backgroundPosition = "center";
    }else{
      avatar.textContent =
        user.username.charAt(0).toUpperCase();
    }

    const onlineDot = document.createElement("div");
    onlineDot.className = "chat-online-dot";

    if(user.online){
      onlineDot.style.display = "block";
    }else{
      onlineDot.style.display = "none";
    }

    avatar.appendChild(onlineDot);

    const info = document.createElement("div");
    info.className = "chat-info";

    const name = document.createElement("div");
    name.className = "chat-name";
    name.textContent = user.username;

    const lastMessage = document.createElement("div");
    lastMessage.className = "last-message";
    lastMessage.textContent = user.last_message || "";

    const time = document.createElement("div");
    time.className = "chat-time";

    const unread = document.createElement("div");
    unread.className = "unread-badge";

    const unreadCount = Number(unreadMap[user.user_id] || 0);

    if(unreadCount > 0){
      unread.textContent = unreadCount > 99 ? "99+" : unreadCount;
    }else{
      unread.style.display = "none";
    }

    if(user.last_message_time){
      time.textContent = new Date(
        String(user.last_message_time).replace(" ", "T") + "Z"
      ).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    const textRow = document.createElement("div");
    textRow.className = "chat-text-row";

    textRow.appendChild(lastMessage);
    textRow.appendChild(time);

    info.appendChild(name);
    info.appendChild(textRow);

    item.appendChild(avatar);
    item.appendChild(info);
    item.appendChild(unread);

    item.onclick = () => {
      window.location.href =
        "/chat.html?userId=" +
        user.user_id +
        "&username=" +
        encodeURIComponent(user.username);
    };

    list.appendChild(item);
  });
}

loadChats();

let chatSocket = null;

const currentUsername = localStorage.getItem("nowaUsername") || "";

async function connectChatRealtime() {
  if (!currentUsername) return;

  try {
    const userRes = await fetch(
      "/api/users?q=" + encodeURIComponent(currentUsername)
    );

    const users = await userRes.json();
    const me = users.find(u => u.username === currentUsername);

    if (me) {
      chatSocket = io({
        query: {
          userId: me.id
        }
      });
    }
  } catch (error) {
    console.error("Realtime setup error:", error);
  }
}

function setupRealtime() {
  if (!chatSocket) return;

  chatSocket.on("newMessage", () => {
    loadChats();
  });
}

connectChatRealtime().then(() => {
  setupRealtime();
});


const chatSearch = document.getElementById("chatSearch");

if (chatSearch) {
  chatSearch.addEventListener("input", () => {
    const query = chatSearch.value.trim().toLowerCase();

    document.querySelectorAll(".chat-item").forEach(item => {
      const name = item.querySelector(".chat-name")?.textContent.toLowerCase() || "";
      item.style.display = !query || name.includes(query) ? "flex" : "none";
    });
  });
}

</script>

<script src="/socket.io/socket.io.js"></script>

<script id="nowa-theme-live">
(function(){
  const applyTheme = () => {
    const theme = localStorage.getItem("nowaTheme") || "dark";
    document.body.classList.toggle("light-theme", theme === "light");
  };

  applyTheme();

  window.addEventListener("storage", applyTheme);
})();
</script>

</body>
</html>
