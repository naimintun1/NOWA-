<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About NOWA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d1119;
  color:#fff;
  font-family:Arial,sans-serif;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  background:#151b27;
  border-bottom:1px solid #222b3b;
}

.back{
  font-size:30px;
  cursor:pointer;
}

.title{
  font-size:18px;
  font-weight:600;
}

.content{
  padding:20px 16px;
}

.logo{
  width:72px;
  height:72px;
  margin:10px auto 16px;
  border-radius:22px;
  background:#168cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
}

.app-name{
  text-align:center;
  font-size:24px;
  font-weight:700;
}

.version{
  text-align:center;
  margin-top:6px;
  color:#7f8da8;
  font-size:13px;
}

.card{
  margin-top:24px;
  padding:16px;
  border-radius:14px;
  background:#151b27;
  border:1px solid #222b3b;
}

.card-title{
  font-size:15px;
  font-weight:600;
  margin-bottom:8px;
}

.card-text{
  color:#9aa7bd;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="back" onclick="history.back()">‹</div>
  <div class="title">About NOWA</div>
</header>

<main class="content">

  <div class="logo">N</div>

  <div class="app-name">NOWA</div>
  <div class="version">Version 1.0</div>

  <div class="card">
    <div class="card-title">About</div>
    <div class="card-text">
      NOWA is a simple and private messaging app
      designed for connecting with people through
      real-time conversations.
    </div>
  </div>

  <div class="card">
    <div class="card-title">Features</div>
    <div class="card-text">
      Private messaging, profiles, friends,
      online status, privacy controls and
      real-time chat.
    </div>
  </div>

</main>

<script>
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";

  if(theme === "light"){
    document.body.classList.add("light-theme");
  }
})();
</script>

</body>
</html>
