<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d1119;
  color:#fff;
  font-family:Arial,sans-serif;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  background:#151b27;
  border-bottom:1px solid #222b3b;
}

.back{
  font-size:30px;
  cursor:pointer;
}

.title{
  font-size:18px;
  font-weight:600;
}

.content{
  padding:16px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 0;
  border-bottom:1px solid #202838;
}

.item-title{
  font-size:15px;
}

.item-sub{
  margin-top:5px;
  color:#7f8da8;
  font-size:12px;
}

.switch{
  position:relative;
  width:48px;
  height:26px;
  flex-shrink:0;
  display:block;
  cursor:pointer;
}

.switch input{
  position:absolute;
  opacity:0;
  width:100%;
  height:100%;
  margin:0;
  cursor:pointer;
  z-index:2;
}

.slider{
  position:absolute;
  inset:0;
  border-radius:20px;
  background:#29334a;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#168cff;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}
</style>

<style id="nowa-global-theme">
body.light-theme{
  background:#f4f6fa !important;
  color:#111827 !important;
}

body.light-theme .topbar,
body.light-theme .nav,
body.light-theme .section,
body.light-theme .profile-card,
body.light-theme .info,
body.light-theme .friends-section,
body.light-theme .item,
body.light-theme .theme-option,
body.light-theme .chat-item,
body.light-theme .online-user,
body.light-theme .search-results{
  background:#ffffff !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .search,
body.light-theme input,
body.light-theme textarea,
body.light-theme #messageInput{
  background:#eef1f6 !important;
  color:#111827 !important;
  border-color:#dfe4ec !important;
}

body.light-theme .section-title,
body.light-theme .item-title,
body.light-theme .theme-title,
body.light-theme .username,
body.light-theme .chat-name,
body.light-theme .online-name,
body.light-theme .friend-name,
body.light-theme .name,
body.light-theme .title,
body.light-theme strong{
  color:#111827 !important;
}

body.light-theme .item-sub,
body.light-theme .empty,
body.light-theme .last-message,
body.light-theme .chat-time,
body.light-theme .friend-name,
body.light-theme .theme-sub,
body.light-theme .info-title{
  color:#6b7280 !important;
}

body.light-theme .back{
  color:#111827 !important;
}

body.light-theme .theme-option.active{
  border-color:#168cff !important;
}
</style>

</head>

<body>

<script id="nowa-global-theme-script">
(function(){
  const theme = localStorage.getItem("nowaTheme") || "dark";
  document.body.classList.toggle("light-theme", theme === "light");
})();
</script>


<header class="topbar">
  <div class="back" onclick="history.back()">‹</div>
  <div class="title">Notifications</div>
</header>

<main class="content">

  <div class="item">
    <div>
      <div class="item-title">Messages</div>
      <div class="item-sub">Get notified about new messages</div>
    </div>

    <label class="switch">
      <input type="checkbox" id="messageNotifications">
      <span class="slider"></span>
    </label>
  </div>

  <div class="item">
    <div>
      <div class="item-title">Follow notifications</div>
      <div class="item-sub">Get notified when someone follows you</div>
    </div>

    <label class="switch">
      <input type="checkbox" id="followNotifications">
      <span class="slider"></span>
    </label>
  </div>

</main>

<script>
const messageNotifications =
  document.getElementById("messageNotifications");

const followNotifications =
  document.getElementById("followNotifications");

messageNotifications.checked =
  localStorage.getItem("nowaMessageNotifications") !== "off";

followNotifications.checked =
  localStorage.getItem("nowaFollowNotifications") !== "off";

messageNotifications.addEventListener("change", () => {
  localStorage.setItem(
    "nowaMessageNotifications",
    messageNotifications.checked ? "on" : "off"
  );
});

followNotifications.addEventListener("change", () => {
  localStorage.setItem(
    "nowaFollowNotifications",
    followNotifications.checked ? "on" : "off"
  );
});
</script>


<script id="nowa-theme-live">
(function(){
  const applyTheme = () => {
    const theme = localStorage.getItem("nowaTheme") || "dark";
    document.body.classList.toggle("light-theme", theme === "light");
  };

  applyTheme();

  window.addEventListener("storage", applyTheme);
})();
</script>

</body>
</html>
